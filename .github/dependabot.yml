version: 2

updates:
  # "/" covers .github/workflows and also the action.yml at the repository
  # root, which matters here because this repository is itself an action.
  # The versions there are pinned to commit SHAs; Dependabot rewrites the SHA
  # and the "# vX.Y.Z" comment next to it together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ['*']
        update-types: [minor, patch]
